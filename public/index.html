<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="VaulS.ai - Hybrid RAG Pipeline for Code and Documentation Search">
  <title>VaulS.ai - RAG Search Engine</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div class="container">
      <div class="header-content">
        <div class="logo">
          <h1>🔍 VaulS.ai</h1>
          <p>Hybrid RAG Search Engine</p>
        </div>
        <nav id="auth-section">
          <button id="login-btn">Login</button>
          <button id="logout-btn" class="hidden">Logout</button>
          <span id="user-info"></span>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <!-- Auth Form -->
      <div id="login-form" class="card hidden auth-form">
        <h2>Login</h2>
        <form onsubmit="return false;">
          <input type="email" id="email" placeholder="Enter your email" required>
          <input type="password" id="password" placeholder="Enter your password" required>
          <button type="submit">Sign In</button>
        </form>
      </div>

      <!-- Search Section -->
      <section id="search-section" class="card">
        <h2>Search Repositories</h2>
        <form id="search-form">
          <div class="search-container">
            <input 
              type="text" 
              id="search-input" 
              placeholder="Ask anything about your code and documentation..." 
              required
            >
            <button type="submit">Search</button>
          </div>
        </form>
      </section>

      <!-- Results Section -->
      <section id="results-section" class="card hidden">
        <div id="results"></div>
      </section>

      <!-- Repository Management -->
      <section id="repository-section" class="card">
        <div class="section-header">
          <h2>Indexed Repositories</h2>
          <button id="add-repo-btn">+ Add Repository</button>
        </div>

        <!-- Add Repository Form -->
        <form id="repo-form" class="hidden">
          <h3>Add Repository for Indexing</h3>
          <input type="text" id="repo-owner" placeholder="Owner/Organization" required>
          <input type="text" id="repo-name" placeholder="Repository name" required>
          <input type="text" id="repo-branch" placeholder="Branch (default: main)">
          <button type="submit">Index Repository</button>
        </form>

        <!-- Repositories List -->
        <div id="repositories-list" class="repositories-grid">
          <p>Loading repositories...</p>
        </div>
      </section>

      <!-- System Status -->
      <section id="status-section" class="card">
        <h2>System Status</h2>
        <div id="health-status">
          <p>Checking system health...</p>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2024 VaulS.ai - Powered by Groq API, Qdrant, and Vercel Postgres</p>
    </div>
  </footer>

  <style>
    header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: white;
      padding: 20px 0;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .logo p {
      font-size: 12px;
      opacity: 0.9;
    }

    nav {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    nav button {
      background-color: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
    }

    nav button:hover {
      background-color: rgba(255, 255, 255, 0.3);
    }

    #user-info {
      font-size: 14px;
      opacity: 0.9;
    }

    main {
      padding: 40px 0;
      min-height: calc(100vh - 200px);
    }

    section {
      margin-bottom: 30px;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 24px;
    }

    h3 {
      margin-bottom: 15px;
      font-size: 18px;
    }

    .search-container {
      display: flex;
      gap: 10px;
    }

    .search-container input {
      flex: 1;
      min-height: 45px;
      font-size: 16px;
    }

    .search-container button {
      padding: 10px 30px;
      min-height: 45px;
      white-space: nowrap;
    }

    .auth-form {
      max-width: 400px;
      margin: 0 auto 30px;
    }

    .auth-form form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .auth-form input {
      width: 100%;
    }

    .auth-form button {
      width: 100%;
    }

    #repo-form {
      background-color: var(--surface-light);
      padding: 15px;
      border-radius: var(--radius);
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    #repo-form input {
      width: 100%;
    }

    #repo-form button {
      width: 100%;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .section-header button {
      padding: 8px 16px;
      font-size: 13px;
    }

    .repositories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 15px;
    }

    .repository-item {
      padding: 15px;
    }

    .repository-item h3 {
      margin-bottom: 10px;
      font-size: 16px;
    }

    .repository-item code {
      background-color: var(--surface-light);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }

    .repository-item p {
      margin-bottom: 8px;
      font-size: 13px;
    }

    .response-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    #response-text {
      background-color: var(--surface-light);
      padding: 15px;
      border-radius: var(--radius);
      line-height: 1.8;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    #sources {
      border-top: 1px solid var(--border);
      padding-top: 15px;
    }

    #sources h4 {
      margin-bottom: 10px;
    }

    #sources ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #sources li {
      background-color: var(--surface-light);
      padding: 10px;
      border-radius: 4px;
      font-size: 13px;
      border-left: 3px solid var(--primary);
    }

    .error {
      background-color: rgba(239, 68, 68, 0.1);
      color: var(--error);
      padding: 15px;
      border-radius: var(--radius);
      border-left: 3px solid var(--error);
    }

    .notification {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 15px 20px;
      border-radius: var(--radius);
      background-color: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      opacity: 0;
      transform: translateY(20px);
      transition: var(--transition);
      z-index: 1000;
      max-width: 300px;
      word-wrap: break-word;
    }

    .notification.show {
      opacity: 1;
      transform: translateY(0);
    }

    .notification-success {
      border-color: var(--success);
      background-color: rgba(16, 185, 129, 0.1);
      color: var(--success);
    }

    .notification-error {
      border-color: var(--error);
      background-color: rgba(239, 68, 68, 0.1);
      color: var(--error);
    }

    footer {
      background-color: var(--surface);
      border-top: 1px solid var(--border);
      padding: 30px 0;
      margin-top: 50px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .header-content {
        flex-direction: column;
        gap: 15px;
      }

      .search-container {
        flex-direction: column;
      }

      .repositories-grid {
        grid-template-columns: 1fr;
      }

      .section-header {
        flex-direction: column;
        gap: 10px;
        align-items: stretch;
      }

      .section-header button {
        width: 100%;
      }
    }
  </style>

  <script src="/app.js"></script>
</body>
</html>
